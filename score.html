<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OOGIRI SCORE</title>
<style>
body{
    background-image: url("bg.png");
    background-repeat: repeat;
    background-size: 200px 200px;
    color:white;
    font-family:sans-serif;
    font-size:30px;
    text-align:center;}
.container{display:flex;justify-content:center;gap:40px;margin-top:30px;}
.judge{background:#76BAAC;padding:25px;border-radius:20px;width:260px;}
.score{font-weight:bold;font-size:80px;margin:-10px 0;}
button{font-size:24px;padding:9px 16px;margin:5px;cursor:pointer;}
input{width:130px;font-size:24px;text-align:center;}
#total{font-size:90px;margin-top:30px;color:white;}
.resetButton{margin-top:25px;font-size:32px;background:#FF97B2;color:white;}
.player{margin:16px;font-size:34px;}
.undoButton{background:#FFA700;color:white;font-size:30px;}
#lastAction{margin-top:18px;font-size:24px;color:#ddd;}
.nameBox{margin:20px auto;padding:18px;background:#AD97FF;border-radius:16px;width:500px;}
.nameRow{margin:8px;font-size:24px;}
.titleImage{width:350px;margin:0px;}
.credit{margin-top:50px;font-size:16px;color:#aaaaaa;}
button{border-radius:10px;}
.funnyGif{
    width:180px;
    cursor:pointer;
}
</style>
</head>

<body>

<img src="title.png" class="titleImage">

<div class="container">

<div class="judge">
<h2 id="judge1Name">審査員A</h2>
<div class="score" id="judge1Score">0</div>
<button onclick="addScore('judge1',1)">＋</button>
<button onclick="addScore('judge1',-1)">－</button><br>
<input type="number" id="judge1Input">
<button onclick="setDirect('judge1')">直接入力</button>
</div>

<div class="judge">
<h2 id="judge2Name">審査員B</h2>
<div class="score" id="judge2Score">0</div>
<button onclick="addScore('judge2',1)">＋</button>
<button onclick="addScore('judge2',-1)">－</button><br>
<input type="number" id="judge2Input">
<button onclick="setDirect('judge2')">直接入力</button>
</div>

<div class="judge">
<h2 id="judge3Name">審査員C</h2>
<div class="score" id="judge3Score">0</div>
<button onclick="addScore('judge3',1)">＋</button>
<button onclick="addScore('judge3',-1)">－</button><br>
<input type="number" id="judge3Input">
<button onclick="setDirect('judge3')">直接入力</button>
</div>

</div>

<div id="total">
<h1>合計: 0</h1>
</div>

<button class="resetButton" onclick="resetScores()">現在得点リセット</button>

<div id="gif">
<img
    id="funnyButton"
    src="still.png"
    onclick="playFunnyGif()"
>
</div>

<div id="players">
<h1>回答者累計</h1>

<div class="player"><span id="player1Name">回答者A</span> : <span id="player1Total">0</span>
<button onclick="addToPlayer('player1')">加算</button>
<input type="number" id="player1Input"><button onclick="setPlayerTotal('player1')">累計入力</button></div>

<div class="player"><span id="player2Name">回答者B</span> : <span id="player2Total">0</span>
<button onclick="addToPlayer('player2')">加算</button>
<input type="number" id="player2Input"><button onclick="setPlayerTotal('player2')">累計入力</button></div>

<div class="player"><span id="player3Name">回答者C</span> : <span id="player3Total">0</span>
<button onclick="addToPlayer('player3')">加算</button>
<input type="number" id="player3Input"><button onclick="setPlayerTotal('player3')">累計入力</button></div>

<div class="player"><span id="player4Name">回答者D</span> : <span id="player4Total">0</span>
<button onclick="addToPlayer('player4')">加算</button>
<input type="number" id="player4Input"><button onclick="setPlayerTotal('player4')">累計入力</button></div>
</div>

<button class="resetButton" onclick="resetPlayerTotals()">累計得点リセット</button>
<br><br>
<button class="undoButton" onclick="undoLastAdd()">直前の加算を取り消す</button>
<div id="lastAction">直前操作：なし</div>

<div class="nameBox">
<h2>名前設定</h2>
<div class="nameRow">審査員1 <input id="judge1NameInput"><button onclick="setName('judges','judge1')">変更</button></div>
<div class="nameRow">審査員2 <input id="judge2NameInput"><button onclick="setName('judges','judge2')">変更</button></div>
<div class="nameRow">審査員3 <input id="judge3NameInput"><button onclick="setName('judges','judge3')">変更</button></div>
<hr>
<div class="nameRow">回答者1 <input id="player1NameInput"><button onclick="setName('players','player1')">変更</button></div>
<div class="nameRow">回答者2 <input id="player2NameInput"><button onclick="setName('players','player2')">変更</button></div>
<div class="nameRow">回答者3 <input id="player3NameInput"><button onclick="setName('players','player3')">変更</button></div>
<div class="nameRow">回答者4 <input id="player4NameInput"><button onclick="setName('players','player4')">変更</button></div>
</div>

<p class="credit">
Created by Poi & ChatGPT
</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL-VOrxHb9peeM94B2mVHlj1u7tmMGafw",
  authDomain: "oogiri-system.firebaseapp.com",
  databaseURL:"https://oogiri-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "oogiri-system",
  storageBucket: "oogiri-system.firebasestorage.app",
  messagingSenderId: "96017540049",
  appId: "1:96017540049:web:0befbba9f7810a725436f0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const defaultNames = {
  judges:{judge1:"審査員A",judge2:"審査員B",judge3:"審査員C"},
  players:{player1:"回答者A",player2:"回答者B",player3:"回答者C",player4:"回答者D"}
};

function playPointSound(){
    const sound = new Audio("point.mp3");
    sound.volume = 0.6;
    sound.play();
}

window.addScore = function(judge, amount){
    playPointSound();
    const scoreRef = ref(db, 'scores/' + judge);
    onValue(scoreRef, (snapshot)=>{
        const current = snapshot.val() || 0;
        set(scoreRef, current + amount);
    }, { onlyOnce:true });
}

window.setDirect = function(judge){
    const value = parseInt(document.getElementById(judge + "Input").value) || 0;
    set(ref(db, 'scores/' + judge), value);
}

window.resetScores = function(){
    set(ref(db, 'scores'), {judge1:0,judge2:0,judge3:0});
}

function capped(value){
    return Math.min(Math.max(value || 0, 0), 20);
}

function getCurrentTotal(data){
    return capped(data.judge1) + capped(data.judge2) + capped(data.judge3);
}

window.addToPlayer = function(player){
    onValue(ref(db, 'scores'), (snapshot)=>{
        const scoreData = snapshot.val() || {};
        const total = getCurrentTotal(scoreData);

        onValue(ref(db, 'names/players/' + player), (nameSnap)=>{
            const playerName = nameSnap.val() || defaultNames.players[player];

            onValue(ref(db, 'players/' + player), (playerSnap)=>{
                const before = playerSnap.val() || 0;
                const after = before + total;

                set(ref(db, 'players/' + player), after);
                set(ref(db, 'lastAction'), {
                    type:"addToPlayer",
                    player,
                    playerName,
                    amount:total,
                    before,
                    after,
                    time:Date.now()
                });

                resetScores();
            }, {onlyOnce:true});
        }, {onlyOnce:true});
    }, {onlyOnce:true});
}

window.undoLastAdd = function(){
    onValue(ref(db, 'lastAction'), (snapshot)=>{
        const action = snapshot.val();
        if(!action || action.type !== "addToPlayer"){
            alert("取り消せる加算がありません");
            return;
        }

        set(ref(db, 'players/' + action.player), action.before);
        set(ref(db, 'lastAction'), {
            type:"undone",
            message: action.playerName + "への" + action.amount + "点加算を取り消しました",
            time:Date.now()
        });
    }, {onlyOnce:true});
}

window.setPlayerTotal = function(player){
    const value = parseInt(document.getElementById(player + "Input").value) || 0;
    set(ref(db, 'players/' + player), value);
}

window.resetPlayerTotals = function(){
    if(confirm("回答者の累計得点をすべて0にしますか？")){
        set(ref(db, 'players'), {player1:0,player2:0,player3:0,player4:0});
    }
}

window.setName = function(group, id){
    const inputId = id + "NameInput";
    const value = document.getElementById(inputId).value.trim();
    if(value){
        set(ref(db, 'names/' + group + '/' + id), value);
    }
}

function updateTotal(data){
    document.getElementById("total").innerText = "合計: " + getCurrentTotal(data);
}

onValue(ref(db, 'scores'), (snapshot)=>{
    const data = snapshot.val() || {};
    document.getElementById("judge1Score").innerText = data.judge1 || 0;
    document.getElementById("judge2Score").innerText = data.judge2 || 0;
    document.getElementById("judge3Score").innerText = data.judge3 || 0;
    updateTotal(data);
});

onValue(ref(db, 'players'), (snapshot)=>{
    const data = snapshot.val() || {};
    document.getElementById("player1Total").innerText = data.player1 || 0;
    document.getElementById("player2Total").innerText = data.player2 || 0;
    document.getElementById("player3Total").innerText = data.player3 || 0;
    document.getElementById("player4Total").innerText = data.player4 || 0;
});

onValue(ref(db, 'names'), (snapshot)=>{
    const names = snapshot.val() || defaultNames;

    ["judge1","judge2","judge3"].forEach(id=>{
        const name = names.judges?.[id] || defaultNames.judges[id];
        document.getElementById(id + "Name").innerText = name;
        document.getElementById(id + "NameInput").value = name;
    });

    ["player1","player2","player3","player4"].forEach(id=>{
        const name = names.players?.[id] || defaultNames.players[id];
        document.getElementById(id + "Name").innerText = name;
        document.getElementById(id + "NameInput").value = name;
    });
});

onValue(ref(db, 'lastAction'), (snapshot)=>{
    const action = snapshot.val();
    if(!action){
        document.getElementById("lastAction").innerText = "直前操作：なし";
        return;
    }

    if(action.type === "addToPlayer"){
        document.getElementById("lastAction").innerText =
            "直前操作：" + action.playerName + "に" + action.amount + "点加算";
    }else if(action.type === "undone"){
        document.getElementById("lastAction").innerText =
            "直前操作：" + action.message;
    }

window.playFunnyGif = function(){

    const el =
        document.getElementById("funnyButton");

    el.src = "funny.gif";

    setTimeout(()=>{
        el.src = "still.png";
    }, 3000);

}

});
</script>

</body>
</html>
