<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OOGIRI OVERLAY</title>

<style>
body{
    margin:0;
    background:transparent;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

.wrapper{
    padding:30px;
    display:flex;
    gap:60px;
    align-items:flex-start;
}

.panel{
    background:rgba(0,0,0,0.65);
    border-radius:20px;
    padding:25px 35px;
    min-width:360px;
}

h2{
    margin:0 0 20px;
    font-size:34px;
    color:gold;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:38px;
    margin:14px 0;
}

.name{
    margin-right:30px;
}

.score{
    font-size:52px;
    font-weight:bold;
    color:#ffffff;
}

.total{
    margin-top:25px;
    font-size:60px;
    color:gold;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="panel">
        <h2>審査員</h2>

        <div class="row">
            <span class="name">審査員A</span>
            <span class="score" id="judge1Score">0</span>
        </div>

        <div class="row">
            <span class="name">審査員B</span>
            <span class="score" id="judge2Score">0</span>
        </div>

        <div class="row">
            <span class="name">審査員C</span>
            <span class="score" id="judge3Score">0</span>
        </div>

        <div class="total" id="currentTotal">合計 0</div>
    </div>

    <div class="panel">
        <h2>回答者累計</h2>

        <div class="row">
            <span class="name">回答者A</span>
            <span class="score" id="player1Total">0</span>
        </div>

        <div class="row">
            <span class="name">回答者B</span>
            <span class="score" id="player2Total">0</span>
        </div>

        <div class="row">
            <span class="name">回答者C</span>
            <span class="score" id="player3Total">0</span>
        </div>

        <div class="row">
            <span class="name">回答者D</span>
            <span class="score" id="player4Total">0</span>
        </div>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL-VOrxHb9peeM94B2mVHlj1u7tmMGafw",
  authDomain: "oogiri-system.firebaseapp.com",
  databaseURL:"https://oogiri-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "oogiri-system",
  storageBucket: "oogiri-system.firebasestorage.app",
  messagingSenderId: "96017540049",
  appId: "1:96017540049:web:0befbba9f7810a725436f0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function getCurrentTotal(data){
    return (data.judge1 || 0) + (data.judge2 || 0) + (data.judge3 || 0);
}

onValue(ref(db, 'scores'), (snapshot)=>{
    const data = snapshot.val() || {};

    setJudgeScore("judge1Score", data.judge1 || 0);
    setJudgeScore("judge2Score", data.judge2 || 0);
    setJudgeScore("judge3Score", data.judge3 || 0);
    document.getElementById("currentTotal").innerText = "合計 " + getCurrentTotal(data);
});

onValue(ref(db, 'players'), (snapshot)=>{
    const data = snapshot.val() || {};

    document.getElementById("player1Total").innerText = data.player1 || 0;
    document.getElementById("player2Total").innerText = data.player2 || 0;
    document.getElementById("player3Total").innerText = data.player3 || 0;
    document.getElementById("player4Total").innerText = data.player4 || 0;
});

function setJudgeScore(id, value){
    const el = document.getElementById(id);
    el.innerText = value;

    if(value >= 20){
        el.classList.add("overLimit");
    }else{
        el.classList.remove("overLimit");
    }
}

</script>

</body>
</html>
