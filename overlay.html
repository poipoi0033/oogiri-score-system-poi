<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OOGIRI OVERLAY</title>

<style>
body{
    margin:0;
    background:transparent;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}
.wrapper{
    padding:30px;
    display:flex;
    gap:60px;
    align-items:flex-start;
}
.panel{
    background:transparent;
    border-radius:20px;
    padding:25px 35px;
    min-width:360px;
}
h2{
    margin:0 0 20px;
    font-size:34px;
    color:gold;
}
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:38px;
    margin:14px 0;
}
.name{ margin-right:30px; }
.score{
    font-size:52px;
    font-weight:bold;
    color:#ffffff;

    display:inline-flex;
    justify-content:center;
    align-items:center;

    width:90px;
    text-align:center;

    font-variant-numeric: tabular-nums;
}
.total{
    margin-top:25px;
    font-size:60px;
    color:gold;
    text-align:center;
    font-weight:bold;
}
#judge1Score.overLimit{
    color:#E0FFF4 !important;
    text-shadow:
        0 0 12px #FFFFFF;
}

#judge2Score.overLimit{
    color:#EBFFC9 !important;
    text-shadow:
        0 0 12px #FFFFFF;
}

#judge3Score.overLimit{
    color:#FFEAF4 !important;
    text-shadow:
        0 0 12px #FFFFFF;
}
.score.bump{
    animation: bump 0.22s ease-out;
}

@keyframes bump{
    0%{
        transform:scale(1);
    }
    45%{
        transform:scale(1.35);
    }
    100%{
        transform:scale(1);
    }
}

#overlayTimer{
    position:fixed;
    top:20px;
    right:20px;
    font-size:48px;
    color:#003495;
    font-weight:bold;
    text-shadow:0 0 8px rgba(0,0,0,0.8);
}

</style>
</head>

<body>

<div id="overlayTimer">10:00</div>

<div class="wrapper">

    <div class="panel">
        <h2>審査員</h2>

        <div class="row">
            <span class="name" id="judge1Name">審査員A</span>
            <span class="score" id="judge1Score">0</span>
        </div>

        <div class="row">
            <span class="name" id="judge2Name">審査員B</span>
            <span class="score" id="judge2Score">0</span>
        </div>

        <div class="row">
            <span class="name" id="judge3Name">審査員C</span>
            <span class="score" id="judge3Score">0</span>
        </div>

        <div class="total" id="currentTotal">合計 0</div>
    </div>

    <div class="panel">
        <h2>回答者累計</h2>

        <div class="row">
            <span class="name" id="player1Name">回答者A</span>
            <span class="score" id="player1Total">0</span>
        </div>

        <div class="row">
            <span class="name" id="player2Name">回答者B</span>
            <span class="score" id="player2Total">0</span>
        </div>

        <div class="row">
            <span class="name" id="player3Name">回答者C</span>
            <span class="score" id="player3Total">0</span>
        </div>

        <div class="row">
            <span class="name" id="player4Name">回答者D</span>
            <span class="score" id="player4Total">0</span>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL-VOrxHb9peeM94B2mVHlj1u7tmMGafw",
  authDomain: "oogiri-system.firebaseapp.com",
  databaseURL:"https://oogiri-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "oogiri-system",
  storageBucket: "oogiri-system.firebasestorage.app",
  messagingSenderId: "96017540049",
  appId: "1:96017540049:web:0befbba9f7810a725436f0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const defaultNames = {
  judges:{judge1:"審査員A",judge2:"審査員B",judge3:"審査員C"},
  players:{player1:"回答者A",player2:"回答者B",player3:"回答者C",player4:"回答者D"}
};

function capped(value){
    return Math.min(Math.max(value || 0, 0), 20);
}

function getCurrentTotal(data){
    return capped(data.judge1)
         + capped(data.judge2)
         + capped(data.judge3);
}

function animateScore(id){
    const el = document.getElementById(id);
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
}

function setJudgeScore(id, value){
    const el = document.getElementById(id);
    const oldValue = el.innerText;

    el.innerText = value;

    if(String(value) !== oldValue){
        animateScore(id);
    }

    if(value >= 20){
        el.classList.add("overLimit");
    }else{
        el.classList.remove("overLimit");
    }
}

onValue(ref(db, 'scores'), (snapshot)=>{
    const data = snapshot.val() || {};

    setJudgeScore("judge1Score", data.judge1 || 0);
    setJudgeScore("judge2Score", data.judge2 || 0);
    setJudgeScore("judge3Score", data.judge3 || 0);

    document.getElementById("currentTotal").innerText =
        "合計 " + getCurrentTotal(data);
});

onValue(ref(db, 'players'), (snapshot)=>{
    const data = snapshot.val() || {};

    document.getElementById("player1Total").innerText = data.player1 || 0;
    document.getElementById("player2Total").innerText = data.player2 || 0;
    document.getElementById("player3Total").innerText = data.player3 || 0;
    document.getElementById("player4Total").innerText = data.player4 || 0;
});

onValue(ref(db, 'names'), (snapshot)=>{
    const names = snapshot.val() || defaultNames;

    ["judge1","judge2","judge3"].forEach(id=>{
        document.getElementById(id + "Name").innerText =
            names.judges?.[id] || defaultNames.judges[id];
    });

    ["player1","player2","player3","player4"].forEach(id=>{
        document.getElementById(id + "Name").innerText =
            names.players?.[id] || defaultNames.players[id];
    });
});

let overlayTimerState = {
    running:false,
    remaining:600,
    endAt:null
};

function getOverlayRemainingSeconds(){
    if(overlayTimerState.running && overlayTimerState.endAt){
        return Math.max(0, Math.ceil((overlayTimerState.endAt - Date.now()) / 1000));
    }
    return overlayTimerState.remaining ?? 600;
}

function updateOverlayTimer(){
    const seconds = getOverlayRemainingSeconds();
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;

    document.getElementById("overlayTimer").innerText =
        String(min).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

setInterval(updateOverlayTimer, 250);

onValue(ref(db, "timer"), (snapshot)=>{
    overlayTimerState = snapshot.val() || {
        running:false,
        remaining:600,
        endAt:null
    };

    updateOverlayTimer();
});

</script>

</body>
</html>
